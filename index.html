<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessão de RPG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            background-image: radial-gradient(circle, #2a2a2a 0%, #121212 80%);
            color: #e0e0e0;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 20, 0.9);
            padding: 40px 60px;
            border: 2px solid #8b0000;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.5), inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: #d4af37; /* Dourado */
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        #countdown {
            font-size: 5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px #8b0000;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 5px;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #aaaaaa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Preparem suas fichas</h1>
        <div id="countdown">00:00:00</div>
        <div class="subtitle">A aventura começa às 13:00</div>
    </div>

    <script>
        function atualizarContagem() {
            // Pega a hora exata de agora
            const agora = new Date();
            
            // Configura o alvo para as 13:00 de hoje
            const alvo = new Date();
            alvo.setHours(13, 0, 0, 0);

            // Calcula a diferença em milissegundos
            const diferenca = alvo - agora;

            // Se a hora já passou das 13:00
            if (diferenca <= 0) {
                document.getElementById('countdown').innerHTML = "ROLAR INICIATIVA!";
                document.getElementById('countdown').style.fontSize = "3rem";
                document.getElementById('countdown').style.color = "#d4af37";
                document.querySelector('.subtitle').style.display = 'none';
                return;
            }

            // Converte a diferença para horas, minutos e segundos
            const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
            const minutos = Math.floor((diferenca / 1000 / 60) % 60);
            const segundos = Math.floor((diferenca / 1000) % 60);

            // Formata para sempre ter dois dígitos (ex: 09, 05)
            const horasFormatadas = String(horas).padStart(2, '0');
            const minutosFormatados = String(minutos).padStart(2, '0');
            const segundosFormatados = String(segundos).padStart(2, '0');

            // Atualiza a tela com o tempo restante
            document.getElementById('countdown').innerHTML = 
                `${horasFormatadas}:${minutosFormatados}:${segundosFormatados}`;
        }

        // Atualiza a contagem a cada 1 segundo (1000 milissegundos)
        setInterval(atualizarContagem, 1000);
        
        // Chama a função imediatamente para não ter delay na tela
        atualizarContagem();
    </script>

</body>
</html>
