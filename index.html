<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Player Morse</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .player {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
      text-align: center;
    }

    button {
      background: #900;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #c00;
    }

    .time {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>

<div class="player">
  <h2>Áudio Criptografado</h2>

  <audio id="audio" src="morsecodegenerator.org_1775337253070.wav"></audio>

  <div>
    <button onclick="playAudio()">▶️ Play</button>
    <button onclick="pauseAudio()">⏸️ Pause</button>
    <button onclick="restartAudio()">🔄 Reiniciar</button>
  </div>

  <div class="time">
    <span id="current">00:00</span> /
    <span id="duration">00:00</span>
    <br>
    Restante: <span id="remaining">00:00</span>
  </div>
</div>

<script>
  const audio = document.getElementById("audio");
  const current = document.getElementById("current");
  const duration = document.getElementById("duration");
  const remaining = document.getElementById("remaining");

  function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
  }

  function playAudio() {
    audio.play();
  }

  function pauseAudio() {
    audio.pause();
  }

  function restartAudio() {
    audio.currentTime = 0;
    audio.play();
  }

  audio.addEventListener("loadedmetadata", () => {
    duration.textContent = formatTime(audio.duration);
  });

  audio.addEventListener("timeupdate", () => {
    current.textContent = formatTime(audio.currentTime);
    remaining.textContent = formatTime(audio.duration - audio.currentTime);
  });

  // NÃO loopa automaticamente (padrão já é sem loop)
  audio.addEventListener("ended", () => {
    console.log("Áudio finalizado");
  });
</script>

</body>
</html>
