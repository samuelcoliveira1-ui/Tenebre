<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva - RPG</title>
    <style>
        /* Estilos com temática de RPG (Escuro e Dourado) */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #d4af37; /* Dourado */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        #timer {
            font-size: 6rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0px 0px 15px rgba(212, 175, 55, 0.5);
            margin: 20px 0;
            letter-spacing: 5px;
        }

        .labels {
            display: flex;
            gap: 65px;
            font-size: 1.2rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mensagem-final {
            color: #d4af37;
            font-size: 4rem;
            text-shadow: 0px 0px 20px rgba(212, 175, 55, 0.8);
        }
    </style>
</head>
<body>

    <h1>A Sessão Começa Em</h1>
    <div id="timer">00:00:00</div>
    <div class="labels" id="labels">
        <span>Horas</span>
        <span>Minutos</span>
        <span>Segundos</span>
    </div>

    <script>
        function iniciarContagem() {
            // Pega a data e hora atual no momento em que a página abre
            const agora = new Date();
            
            // Cria a data alvo baseada em agora e avança 1 dia
            const dataAlvo = new Date(agora);
            dataAlvo.setDate(agora.getDate() + 1);
            
            // Configura o horário alvo estritamente para as 13:00:00
            dataAlvo.setHours(13, 0, 0, 0);

            const atualizarTimer = () => {
                const tempoAtual = new Date().getTime();
                const tempoRestante = dataAlvo.getTime() - tempoAtual;

                // Se o tempo acabar
                if (tempoRestante <= 0) {
                    document.getElementById("timer").innerHTML = "ROLEM OS DADOS!";
                    document.getElementById("timer").classList.add("mensagem-final");
                    document.getElementById("labels").style.display = "none";
                    clearInterval(intervalo);
                    return;
                }

                // Cálculo convertendo os milissegundos direto para horas, minutos e segundos
                const horas = Math.floor(tempoRestante / (1000 * 60 * 60));
                const minutos = Math.floor((tempoRestante % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((tempoRestante % (1000 * 60)) / 1000);

                // Adiciona um "0" na frente de números menores que 10 (ex: 09, 08)
                const horasFormatadas = String(horas).padStart(2, '0');
                const minutosFormatados = String(minutos).padStart(2, '0');
                const segundosFormatados = String(segundos).padStart(2, '0');

                // Atualiza o HTML
                document.getElementById("timer").innerHTML = 
                    `${horasFormatadas}:${minutosFormatados}:${segundosFormatados}`;
            };

            // Atualiza imediatamente na tela e depois atualiza a cada 1 segundo (1000 ms)
            atualizarTimer();
            const intervalo = setInterval(atualizarTimer, 1000);
        }

        iniciarContagem();
    </script>
</body>
</html>
